[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot 企业软件支持诊断应用"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "langgraph>=0.4,<1",
  "langgraph-checkpoint-postgres>=2.0,<3",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=opspilot --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured PostgreSQL database"]

[tool.coverage.run]
branch = true
source = ["opspilot"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
exclude = ["^spikes/"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph_checkpoint_postgres.*", "pgvector.*"]
ignore_missing_imports = true
