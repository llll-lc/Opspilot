name: opspilot-op001-pgvector

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: opspilot-op001-pgvector
    environment:
      POSTGRES_DB: op001
      POSTGRES_USER: op001
      POSTGRES_PASSWORD: op001-local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U op001 -d op001"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    profiles: ["core"]
